name: release-please

# Merging the release pull request is the release: Release Please tags
# v<version> and creates a draft GitHub release. The app is signed and
# notarized with a Developer ID and a Sparkle key that stay in the
# maintainer's keychain, so scripts/release.sh builds it on a Mac, attaches
# the DMG, the Sparkle zip and appcast.xml, then publishes the draft. Until
# then the feed (releases/latest) still points at the previous release.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
